[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oste-ariel"
version = "1.0.0"
description = "Hardware-Accelerated Exoplanet Atmospheric Inversion and Triage Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kaan Yilmaz"}]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]